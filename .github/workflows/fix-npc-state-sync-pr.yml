name: Validate and apply NPC state sync fix

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-npc-state-sync
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Patch NPC persistence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'js/world-bootstrap.js',
              """            relationship: cleanText(input.relationship || 'neutrale', 100),
            status: normalizeStatus(input.status),
            location: cleanText(input.location, 120),
            lastMove: cleanText(input.lastMove, 320),""",
              """            relationship: cleanText(input.relationship || 'neutrale', 100),
            status: normalizeStatus(input.status),
            activity: cleanText(input.activity, 80),
            location: cleanText(input.location, 120),
            lastMove: cleanText(input.lastMove, 320),""",
              'normalizeActor activity'
          )

          replace_once(
              'js/world-bootstrap.js',
              """                relationship: actor.relationship, personality: actor.personality, goals: actor.goal,
                status: actor.status, location: actor.location, faction: actor.faction,
                role: actor.role, strategy: actor.strategy, resources: actor.resources,""",
              """                relationship: actor.relationship, personality: actor.personality, goals: actor.goal,
                status: actor.status, activity: actor.activity, location: actor.location, faction: actor.faction,
                role: actor.role, strategy: actor.strategy, resources: actor.resources,""",
              'projectToMemory activity'
          )

          replace_once(
              'js/world-bootstrap.js',
              """        world.actors = mergeByName(world.actors, asArray(memory?.npcs).filter(item => isConcreteEntity(item, 'actor')).map(item => ({
            ...item, goal: item.goals || item.goal, influence: item.influence || Math.min(100, Math.max(10, Number(item.level || 1) * 10)),
            source: item.source || 'memory'
        })), normalizeActor, LIMITS.actors, context);""",
              """        const memoryActors = asArray(memory?.npcs).filter(item => isConcreteEntity(item, 'actor')).map(item => ({
            ...item, goal: item.goals || item.goal, influence: item.influence || Math.min(100, Math.max(10, Number(item.level || 1) * 10)),
            source: item.source || 'memory'
        }));
        const runtimeActors = new Map(world.actors.map(actor => [keyOf(actor.name), { ...actor }]));
        world.actors = mergeByName(world.actors, memoryActors, normalizeActor, LIMITS.actors, context);
        world.actors.forEach(actor => {
            const runtime = runtimeActors.get(keyOf(actor.name));
            if (!runtime) return;
            const stored = memoryActors.find(item => keyOf(item?.name) === keyOf(actor.name));
            const runtimeMoveTurn = Math.max(0, Number(runtime.lastMoveTurn) || 0);
            const storedMoveTurn = Math.max(0, Number(stored?.lastMoveTurn) || 0);
            const runtimeInteractionTurn = Math.max(0, Number(runtime.lastInteractionTurn) || 0);
            const storedInteractionTurn = Math.max(0, Number(stored?.lastInteractionTurn) || 0);

            // world.actors e' autoritativo quando contiene una mossa piu recente.
            // Evita che worldMemory.npcs stale annulli una mossa appena applicata.
            if (runtimeMoveTurn > storedMoveTurn) {
                actor.lastMove = runtime.lastMove;
                actor.lastMoveTurn = runtimeMoveTurn;
                actor.activity = runtime.activity;
                actor.status = runtime.status;
            }
            if (runtimeInteractionTurn > storedInteractionTurn) {
                actor.lastInteractionTurn = runtimeInteractionTurn;
            }
        });""",
              'fresh actor sync'
          )

          replace_once(
              'js/world-bootstrap.js',
              """            actor.lastMove = cleanText(move.action, 320);
            actor.lastMoveTurn = Math.max(0, Number(turn) || 0);
            if (move.status && !/in.?progress|in corso/i.test(move.status)) actor.activity = cleanText(move.status, 80);""",
              """            actor.lastMove = cleanText(move.action, 320);
            actor.lastMoveTurn = Math.max(0, Number(turn) || 0);
            if (move.status && !/in.?progress|in corso/i.test(move.status)) {
                actor.activity = cleanText(move.status, 80);
                const moveStatus = keyOf(move.status);
                if (/^(dead|morto|dormant|dormiente|inactive|inattivo|inattiva)$/.test(moveStatus)) {
                    actor.status = normalizeStatus(move.status);
                }
            }""",
              'applyWorldMoves state'
          )

          replace_once(
              'index.html',
              """                G.worldMemory.world = worldBootstrapEngine.applyWorldMoves(
                    G.worldMemory.world,
                    committedMoves,
                    G.worldMemory.turnCount || 0,
                    { story: G.currentStory, location: G.currentLocation }
                );
                updateMemoryUI();""",
              """                G.worldMemory.world = worldBootstrapEngine.applyWorldMoves(
                    G.worldMemory.world,
                    committedMoves,
                    G.worldMemory.turnCount || 0,
                    { story: G.currentStory, location: G.currentLocation }
                );
                // Propaga subito la mossa alla copia usata da prompt e UI.
                // Cosi' una migrazione successiva non puo' ripristinare un NPC stale.
                G.worldMemory = worldBootstrapEngine.projectToMemory(G.worldMemory.world, G.worldMemory, {
                    story: G.currentStory,
                    turn: G.worldMemory.turnCount || 0,
                    protagonistName: G.character?.name
                });
                updateMemoryUI();
                renderNPCRegistry();""",
              'generateAI projection'
          )

          replace_once(
              'index.html',
              'js/world-bootstrap.js?v=20260818-npc-fix-4',
              'js/world-bootstrap.js?v=20260818-npc-fix-5',
              'world bootstrap cache bust'
          )

          marker = "test('il mondo non registra una seconda copia del protagonista come NPC', () => {"
          regression = r"""test('una mossa NPC piu recente non viene annullata dalla sincronizzazione della memoria', () => {
    const world = makeConcreteWorld();
    const memory = worldBootstrapApi.projectToMemory(world, memoryApi.createDefaultMemory(), { turn: 1 });
    const stale = memory.npcs.find(item => item.name === 'Elara Vey');
    stale.lastMove = 'Attende una decisione del consiglio';
    stale.lastMoveTurn = 1;

    let moved = worldBootstrapApi.applyWorldMoves(world, [{
        actor: 'Elara Vey',
        action: 'Convoca segretamente Mira Sol per costruire una maggioranza',
        status: 'active',
        visibility: 'hidden'
    }], 2);
    moved = worldBootstrapApi.syncFromMemory(moved, memory, { turn: 2 });

    const actor = moved.actors.find(item => item.name === 'Elara Vey');
    assert.equal(actor.lastMove, 'Convoca segretamente Mira Sol per costruire una maggioranza');
    assert.equal(actor.lastMoveTurn, 2);
    assert.equal(actor.activity, 'active');

    worldBootstrapApi.projectToMemory(moved, memory, { turn: 2 });
    const projected = memory.npcs.find(item => item.name === 'Elara Vey');
    assert.equal(projected.lastMove, actor.lastMove);
    assert.equal(projected.lastMoveTurn, 2);
    assert.equal(projected.activity, 'active');
});

test('una mossa del mondo puo rendere dormiente un NPC senza confondere resolved con lo stato vitale', () => {
    const world = makeConcreteWorld();
    const dormant = worldBootstrapApi.applyWorldMoves(world, [{
        actor: 'Taren', action: 'Scompare dai quartieri della capitale', status: 'dormant', visibility: 'hidden'
    }], 3);
    assert.equal(dormant.actors.find(item => item.name === 'Taren').status, 'dormant');

    const resolvedMove = worldBootstrapApi.applyWorldMoves(dormant, [{
        actor: 'Elara Vey', action: 'Conclude la consultazione', status: 'resolved', visibility: 'visible'
    }], 4);
    assert.equal(resolvedMove.actors.find(item => item.name === 'Elara Vey').status, 'active');
    assert.equal(resolvedMove.actors.find(item => item.name === 'Elara Vey').activity, 'resolved');
});

"""
          p = Path('tests/run-tests.js')
          text = p.read_text(encoding='utf-8')
          if text.count(marker) != 1:
              raise SystemExit(f'test marker: expected 1 match, found {text.count(marker)}')
          p.write_text(text.replace(marker, regression + marker, 1), encoding='utf-8')

          # Questo workflow serve solo ad applicare e validare il fix.
          Path('.github/workflows/fix-npc-state-sync-pr.yml').unlink()
          PY

      - name: Validate
        run: |
          npm test
          npm run check
          git diff --check

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: persist NPC state changes across turns'
          git push origin HEAD:agent/fix-npc-state-sync
